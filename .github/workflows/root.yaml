name: root build

# ブランチ名制限なし・path 制限なし。
# 毎回キャッシュ付きで image を建て、その SHA タグで原稿をビルドする。
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-container:
    permissions:
      contents: read
      packages: write
    secrets: inherit
    uses: ./.github/workflows/build-container.yaml

  build-manuscript:
    needs: build-container
    permissions:
      contents: read
      packages: read
    secrets: inherit
    uses: ./.github/workflows/pandoc.yaml
    with:
      working-directory: .
      image_ref: ${{ needs.build-container.outputs.image_ref }}
